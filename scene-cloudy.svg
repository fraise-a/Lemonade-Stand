<svg class="cloudy" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 780" fill="none">
<style>
.overcast{display:none}.sunlight{transform:translate(-650px,0)}
.hot .sky{fill:url(#hot-sky)}.hot .fair-clouds{display:none}.hot .sun-disc{fill:#ffca63}.hot .sun-glow{opacity:.65}
.cloudy .sky{fill:url(#cloudy-sky)}.storm .sky{fill:url(#storm-sky)}
.cloudy .sunlight,.storm .sunlight,.cloudy .fair-clouds,.storm .fair-clouds{display:none}
.cloudy .overcast,.storm .overcast{display:inline}
.cloudy .landscape{filter:saturate(.65) brightness(.84)}
.storm .landscape{filter:saturate(.45) brightness(.47)}
.storm .overcast{filter:brightness(.48) saturate(.65)}
</style>
